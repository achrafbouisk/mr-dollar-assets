<script type="text/plain" id="warp">// Talking-portrait warp for the series-2021 $1 bill scan. Works in scan pixels (1920 x 806, y down).
uniform float uJaw, uWide, uRound, uBlink, uBrow, uRoll;
uniform vec2 uHead;
const vec2 IMG = vec2(1920.0, 806.0);
float soft(float x) { return smoothstep(1.0, 0.0, x); }
vec2 warpPx(vec2 P, out float gap) {
  gap = 0.0;
  // head: small nods / sway / tilt that fade out before the oval frame and the coat
  vec2 HC = vec2(1000.0, 389.0);
  float hm = smoothstep(1.0, 0.72, length((P - HC) / vec2(118.0, 152.0)));
  vec2 piv = vec2(1009.0, 537.0);
  float a = uRoll * hm;
  vec2 Q = P - uHead * hm;
  Q = piv + mat2(cos(a), sin(a), -sin(a), cos(a)) * (Q - piv);
  // eyebrows lift
  float mb = soft(length((Q - vec2(967.0, 349.0)) / vec2(27.0, 16.0))) + soft(length((Q - vec2(1035.0, 349.0)) / vec2(27.0, 16.0)));
  Q.y += uBrow * 4.1 * mb;
  // mouth and jaw
  vec2 M = vec2(1007.0, 447.5);
  float hw = 29.0 * (1.0 + 0.22 * uWide - 0.36 * uRound);
  float dx = (Q.x - M.x) / hw;
  float lens = pow(clamp(1.0 - dx * dx, 0.0, 1.0), 0.8);
  float open = uJaw * 13.5 * (1.0 + 0.25 * uRound);
  float jx = exp(-pow((Q.x - M.x) / 57.0, 2.0));
  float below = Q.y - M.y;
  if (below >= 0.0) {
    float g = 1.0 - smoothstep(9.5, 76.0, below);
    float s = smoothstep(0.0, 25.0, below);
    float d = open * (lens + max(jx - lens, 0.0) * s) * g;
    float ys = Q.y - d;
    gap = smoothstep(0.0, 2.8, M.y - ys);
    Q.y = ys;
  } else {
    float up = open * 0.42 * lens * (1.0 - smoothstep(0.0, 17.5, -below));
    float ys = Q.y + up;
    gap = smoothstep(0.0, 2.8, ys - M.y);
    Q.y = ys;
  }
  return Q;
}
// closed-eye lash line, drawn while blinking
float lashLine(vec2 P) {
  float l1 = exp(-pow((P.y - 368.0) / 1.4, 2.0)) * smoothstep(1.0, 0.6, abs(P.x - 967.5) / 16.0);
  float l2 = exp(-pow((P.y - 368.5) / 1.4, 2.0)) * smoothstep(1.0, 0.6, abs(P.x - 1035.0) / 16.0);
  return uBlink * uBlink * (l1 + l2);
}
// eyelid coverage for blinks: 1 inside each eye opening
float eyeLid(vec2 Q) {
  float m1 = smoothstep(1.0, 0.55, length((Q - vec2(967.5, 364.0)) / vec2(16.0, 7.3)));
  float m2 = smoothstep(1.0, 0.55, length((Q - vec2(1035.0, 364.5)) / vec2(16.0, 7.3)));
  return clamp(m1 + m2, 0.0, 1.0) * smoothstep(0.0, 0.6, uBlink);
}

const bill = new THREE.Group(); bill.position.y = BY; scene.add(bill);
let frontMat, backMat, billDef, pDecal = null, photoTex = null, backTex = null;
const FACE = { uJaw: { value: 0 }, uWide: { value: 0 }, uRound: { value: 0 }, uBlink: { value: 0 }, uBrow: { value: 0 }, uRoll: { value: 0 }, uHead: { value: new THREE.Vector2() } };

function buildBill() {

      .replace('#include <map_fragment>', `#ifdef USE_MAP

        vec2 quv = vec2(Q.x / IMG.x, 1.0 - Q.y / IMG.y), tx = vec2(1.0 / IMG.x, 0.0), ty = vec2(0.0, 1.0 / IMG.y);
        vec4 sampledDiffuseColor = texture2D(map, quv) * 1.48 - 0.12 * (texture2D(map, quv + tx) + texture2D(map, quv - tx) + texture2D(map, quv + ty) + texture2D(map, quv - ty));

        sampledDiffuseColor.rgb = pow(clamp(sampledDiffuseColor.rgb * vec3(0.969, 0.969, 1.061), 0.0, 1.0), vec3(1.12)) * vec3(1.08, 1.11, 1.06);

/* ================= camera framing & close-up ================= */
const view = { mode: 'wide', t: 1, from: null, to: null };
function wideView() {
  const a = innerWidth / innerHeight, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), ui = innerHeight / Math.max(240, innerHeight - 220);
  const d = Math.max((BH + 0.55) * ui / 2 / tan, BW * 1.08 / 2 / (tan * a)) * 1.02;
  return { pos: new THREE.Vector3(0, BY + 0.32, d), target: new THREE.Vector3(0, BY - 0.02, 0) };
}
function closeView() {
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), oh = 2 * POVAL.ry * BW / PW, a = innerWidth / innerHeight;
  const d = Math.max(oh / 0.62 / 2 / tan, (2 * POVAL.rx * BW / PW) / 0.55 / 2 / (tan * a));
  const py = BY + (0.5 - POVAL.cy / PH) * BH;
  return { pos: new THREE.Vector3(0, py + 0.08, d), target: new THREE.Vector3(0, py - 0.02, 0) };
}
function goTo(mode) { view.mode = mode; view.from = { pos: camera.position.clone(), target: controls.target.clone() }; view.to = mode === 'close' ? closeView() : wideView(); view.t = 0; document.getElementById('close').classList.toggle('on', mode === 'close'); document.querySelector('.ui').style.opacity = mode === 'close' ? 0 : 1; }
function snap() { const v = view.mode === 'close' ? closeView() : wideView(); camera.position.copy(v.pos); controls.target.copy(v.target); controls.minDistance = wideView().pos.z * 0.25; controls.maxDistance = wideView().pos.z * 1.6; controls.update(); }

/* ================= speech & lip sync ================= */
const sub = document.getElementById('sub');
const LINE = "Good day, everyone. I'm the US dollar. I've been travelling the world since 1944, and I hear some of you have questions about my future, and my friends in BRICS. Ask away.";
const VIS = {
  A: { jawOpen: 0.42, mouthLowerDown_L: 0.25, mouthLowerDown_R: 0.25 }, E: { jawOpen: 0.17, mouthStretch_L: 0.35, mouthStretch_R: 0.35 },
  O: { jawOpen: 0.28, mouthFunnel: 0.55 }, U: { jawOpen: 0.1, mouthPucker: 0.7 }, M: { mouthClose: 0.12, mouthPress_L: 0.5, mouthPress_R: 0.5 },
  F: { jawOpen: 0.07, mouthRollLower: 0.5, mouthUpperUp_L: 0.2, mouthUpperUp_R: 0.2 }, T: { jawOpen: 0.14, mouthStretch_L: 0.12, mouthStretch_R: 0.12 }, _: {}
};
const MOUTH_KEYS = [...new Set(Object.values(VIS).flatMap(v => Object.keys(v)))];
const visOf = ch => { ch = ch.toLowerCase(); if ('a'.includes(ch)) return 'A'; if ('ei'.includes(ch)) return 'E'; if ('o'.includes(ch)) return 'O'; if ('uwq'.includes(ch)) return 'U'; if ('mbp'.includes(ch)) return 'M'; if ('fv'.includes(ch)) return 'F'; if (/[a-z]/.test(ch)) return 'T'; return '_'; };
const speech = { text: '', start: 0, cps: 13.5, pos: 0, active: false };
const mouthW = Object.fromEntries(MOUTH_KEYS.map(k => [k, 0]));
function pickVoice() { const v = speechSynthesis.getVoices(); return v.find(x => /Daniel|George|Arthur|Google UK English Male|Microsoft (Ryan|Guy|George)/i.test(x.name)) || v.find(x => x.lang === 'en-GB') || v.find(x => x.lang && x.lang.startsWith('en')); }
let autoClose = false;
function say(text) {
  speechSynthesis && speechSynthesis.cancel();
  speech.text = text; speech.pos = 0; sub.textContent = text; sub.style.opacity = 1;
  const begin = () => { if (speech.active) return; speech.active = true; st.talking = true; speech.start = performance.now(); };
  const end = () => { speech.active = false; st.talking = false; sub.style.opacity = 0; if (autoClose) { autoClose = false; setTimeout(() => { if (!st.talking) goTo('wide'); }, 1200); } };
  if (view.mode !== 'close') { autoClose = true; goTo('close'); }
  if (!('speechSynthesis' in window)) { begin(); setTimeout(end, text.length / speech.cps * 1000); return; }
  const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if (v) u.voice = v; u.rate = 0.93; u.pitch = 0.85;
  u.onstart = begin; u.onend = u.onerror = end;
  u.onboundary = e => { if (e.charIndex != null) { speech.pos = e.charIndex; speech.start = performance.now() - e.charIndex / speech.cps * 1000; } };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!speech.active && st.talking === false && sub.style.opacity === '1') { begin(); setTimeout(() => { if (speech.active) end(); }, text.length / speech.cps * 1000); } }, 900);
}
document.getElementById('speak').onclick = () => say(LINE);
document.getElementById('close').onclick = () => { autoClose = false; goTo(view.mode === 'close' ? 'wide' : 'close'); };
addEventListener('pointermove', e => { st.mx = e.clientX / innerWidth * 2 - 1; st.my = -(e.clientY / innerHeight * 2 - 1); });
window.__dbg = { face: FACE, say, goTo, st, back: () => { view.t = 1; camera.position.set(0.4, BY + 0.3, -wideView().pos.z); controls.update(); }, setTalk: v => { st.talking = v; speech.active = v; speech.text = LINE; speech.start = performance.now(); } };

/* ================= animation ================= */
const clock = new THREE.Clock(); let last = 0, nextBlink = 2.5, blinkT = -1, brow = 0, browT = 0, sacc = { x: 0, y: 0, t: 0 };
// moods set by the page wrapper: window.__mood = 'listen' | 'think' | null
const mood = { listen: 0, think: 0 }, nod = { t: -1, a: 0, next: 0 }; let lastChar = -1;
function startNod(a) { if (nod.t < 0 || nod.t > 0.25) { nod.t = 0; nod.a = a; } }
function animate() {
  const t = clock.getElapsedTime(); st.dt = Math.min(0.05, t - last); last = t; st.t = t;
  st.talk += ((st.talking ? 1 : 0) - st.talk) * 0.08;
  if (t > nextBlink && blinkT < 0) blinkT = 0;
  if (blinkT >= 0) { blinkT += st.dt; st.blink = blinkT < 0.07 ? blinkT / 0.07 : blinkT < 0.16 ? 1 - (blinkT - 0.07) / 0.09 : 0; if (blinkT >= 0.16) { blinkT = -1; st.blink = 0; nextBlink = t + 2.2 + Math.random() * 3.5; } }

  if (st.talking && t > browT) { brow = Math.random() < 0.45 ? 0.5 + Math.random() * 0.5 : 0; browT = t + 0.6 + Math.random() * 1.2; }
  if (!st.talking) brow *= 0.95;
  const m = window.__mood || null;
  mood.listen += ((m === 'listen' && !st.talking ? 1 : 0) - mood.listen) * 0.06;
  mood.think += ((m === 'think' && !st.talking ? 1 : 0) - mood.think) * 0.06;
  if (m === 'listen' && !st.talking && t > nod.next) { startNod(0.5 + Math.random() * 0.4); nod.next = t + 2.2 + Math.random() * 2.5; }
  if (speech.active) {                         // nod at the end of each phrase
    const ci = Math.floor((performance.now() - speech.start) / 1000 * speech.cps);
    if (ci !== lastChar) { const c = speech.text[ci] || ''; if (/[.!?]/.test(c)) startNod(1); else if (c === ',' && Math.random() < 0.5) startNod(0.5); lastChar = ci; }
  }
  let nodY = 0;
  if (nod.t >= 0) { nod.t += st.dt; nodY = nod.a * Math.sin(Math.min(1, nod.t / 0.42) * Math.PI); if (nod.t > 0.42) nod.t = -1; }

  bill.position.y = BY + Math.sin(t * 1.1) * 0.05 + st.talk * Math.abs(Math.sin(t * 4.2)) * 0.02;
  bill.rotation.y += (st.mx * 0.22 - bill.rotation.y) * 0.04; bill.rotation.x += (-0.08 - st.my * 0.06 - bill.rotation.x) * 0.04; bill.rotation.z = Math.sin(t * 0.7) * 0.025;

    const target = {};

      const pos = (performance.now() - speech.start) / 1000 * speech.cps, i = Math.floor(pos), f = pos - i;
      const ch = speech.text[i] || ' ', nx = speech.text[i + 1] || ' ';
      const a = VIS[visOf(ch)], b = VIS[visOf(nx)];

      if (/[.,!?;:]/.test(ch)) for (const k of MOUTH_KEYS) target[k] = 0;
    }
    for (const k of MOUTH_KEYS) mouthW[k] += ((target[k] || 0) - mouthW[k]) * 0.35;
    let amp = -1; try { if (window.__amp) amp = window.__amp(); } catch (e) { }
    let loud = 1;
    if (amp >= 0) { st.ampS = (st.ampS || 0) + (amp - (st.ampS || 0)) * (amp > (st.ampS || 0) ? 0.55 : 0.25); loud = Math.min(1.3, st.ampS * 9); }
    const jaw = (mouthW.jawOpen * 2.8 + (mouthW.mouthLowerDown_L || 0) * 0.5) * loud;

    FACE.uRound.value = Math.min(1, mouthW.mouthFunnel * 0.9 + mouthW.mouthPucker);
    FACE.uWide.value = (mouthW.mouthStretch_L || 0) * 2.2;

      -st.my * 1.2 + tk * 1.6 * Math.sin(t * 2.3) + 0.6 * Math.sin(t * 0.9) + nodY * 3.2 - T * 3.0 + L * 1.0);

  }

  controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); snap(); });
let hintTimer = setTimeout(() => document.getElementById('hint').style.opacity = 0, 7000);
controls.addEventListener('start', () => { clearTimeout(hintTimer); document.getElementById('hint').style.opacity = 0; });

/* ================= boot ================= */
const fonts = ['700 40px "Old Standard TT"', '400 40px "Old Standard TT"', 'italic 400 20px "Old Standard TT"', '400 40px "Mrs Saint Delafield"'].map(f => document.fonts.load(f).catch(() => { }));
await Promise.race([Promise.all(fonts), new Promise(r => setTimeout(r, 4000))]);
async function loadBill(side) {
  for (const url of ['api/bill?side=' + side, 'https://cdn.jsdelivr.net/gh/achrafbouisk/mr-dollar-assets@main/' + side + '.jpg']) {
    try { return await new THREE.TextureLoader().loadAsync(url); } catch (e) { console.warn('bill image failed: ' + url, e); }
  }

}
[photoTex, backTex] = await Promise.all([loadBill('front'), loadBill('back')]);
if (backTex) { backTex.colorSpace = THREE.SRGBColorSpace; backTex.anisotropy = ANISO; }
photoTex.colorSpace = THREE.SRGBColorSpace; photoTex.anisotropy = ANISO;
buildBill(); snap(); window.__portraitReady = true;
document.getElementById('load').style.opacity = 0; window.__ready = true;
animate();

</script>
